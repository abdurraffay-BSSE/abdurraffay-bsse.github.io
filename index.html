<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FOLIXA Hair Oil</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f7f4ec;
  color:#1d2b22;
}

.wrap{
  max-width:850px;
  margin:auto;
  padding:22px 16px 45px;
}

h1{
  text-align:center;
  margin:5px 0 22px;
  font-size:32px;
  letter-spacing:.5px;
}

/* IMAGE SLIDER */
.slider{
  width:100%;
  overflow:hidden;
  border-radius:16px;
  margin-bottom:24px;
  background:#eee9dc;
}

.slides{
  display:flex;
  width:300%;
  animation:slide 9s infinite;
}

.slides img{
  width:33.3333%;
  height:420px;
  object-fit:cover;
  display:block;
}

@keyframes slide{
  0%,28%{
    transform:translateX(0);
  }

  33%,61%{
    transform:translateX(-33.3333%);
  }

  66%,94%{
    transform:translateX(-66.6666%);
  }

  100%{
    transform:translateX(0);
  }
}

/* FORM */
.card{
  background:#fff;
  border-radius:18px;
  padding:22px;
  box-shadow:0 5px 25px rgba(0,0,0,.07);
}

label{
  display:block;
  font-weight:600;
  margin:14px 0 7px;
}

input,
select,
textarea{
  width:100%;
  padding:13px 14px;
  border:1px solid #d6d6d0;
  border-radius:10px;
  font-size:16px;
  background:#fff;
  outline:none;
}

textarea{
  min-height:95px;
  resize:vertical;
}

button{
  width:100%;
  margin-top:20px;
  padding:15px;
  border:0;
  border-radius:11px;
  background:#1d2b22;
  color:#fff;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

/* SUCCESS MESSAGE */
.message{
  display:none;
  margin-top:16px;
  padding:14px;
  border-radius:10px;
  background:#e9f5eb;
  color:#245b31;
  text-align:center;
  font-weight:600;
}

/* MOBILE */
@media(max-width:650px){

  .slides img{
    height:330px;
  }

  h1{
    font-size:28px;
  }

}
</style>

</head>

<body>

<div class="wrap">

  <h1>FOLIXA Hair Oil</h1>

  <!-- PRODUCT IMAGES -->
  <div class="slider">

    <div class="slides">

      <img
        src="../images/folixa-1.webp"
        alt="FOLIXA Hair Oil"
        loading="eager"
      >

      <img
        src="../images/folixa-2.webp"
        alt="FOLIXA Hair Oil"
        loading="lazy"
      >

      <img
        src="../images/folixa-3.webp"
        alt="FOLIXA Hair Oil"
        loading="lazy"
      >

    </div>

  </div>


  <!-- ORDER FORM -->
  <div class="card">

    <form id="orderForm">

      <input
        type="hidden"
        name="_subject"
        value="New FOLIXA Order"
      >

      <input
        type="hidden"
        name="_captcha"
        value="false"
      >

      <input
        type="hidden"
        name="_template"
        value="table"
      >


      <label for="name">Full Name</label>

      <input
        id="name"
        name="Customer Name"
        type="text"
        required
      >


      <label for="phone">Phone Number</label>

      <input
        id="phone"
        name="Phone Number"
        type="tel"
        required
      >


      <label for="city">City</label>

      <input
        id="city"
        name="City"
        type="text"
        required
      >


      <label for="address">Complete Address</label>

      <textarea
        id="address"
        name="Complete Address"
        required
      ></textarea>


      <label for="quantity">Quantity</label>

      <select
        id="quantity"
        name="Quantity"
        required
      >

        <option value="1 Bottle">
          1 Bottle
        </option>

        <option value="2 Bottles">
          2 Bottles
        </option>

        <option value="3 Bottles">
          3 Bottles
        </option>

        <option value="4 Bottles">
          4 Bottles
        </option>

        <option value="5 Bottles">
          5 Bottles
        </option>

      </select>


      <label for="payment">Payment Method</label>

      <select
        id="payment"
        name="Payment Method"
        required
      >

        <option value="Cash on Delivery">
          Cash on Delivery
        </option>

        <option value="Bank Transfer">
          Bank Transfer
        </option>

      </select>


      <button
        id="submitBtn"
        type="submit"
      >
        Place Order
      </button>


      <div
        id="message"
        class="message"
      >
        Order has been submitted. You will be contacted shortly.
      </div>

    </form>

  </div>

</div>


<script>

const form = document.getElementById("orderForm");
const button = document.getElementById("submitBtn");
const message = document.getElementById("message");

form.addEventListener("submit", async function(e){

  e.preventDefault();

  button.disabled = true;
  button.textContent = "Submitting...";

  const data = new FormData(form);

  try{

    const response = await fetch(
      "https://formsubmit.co/ajax/nayapayonly13@gmail.com",
      {
        method:"POST",
        body:data,
        headers:{
          "Accept":"application/json"
        }
      }
    );

    if(!response.ok){
      throw new Error("Submission failed");
    }

    form.reset();

    message.style.display = "block";

    button.textContent = "Order Submitted";

  }

  catch(error){

    button.disabled = false;

    button.textContent = "Place Order";

    alert(
      "Something went wrong. Please try again."
    );

  }

});

</script>

</body>
</html>
