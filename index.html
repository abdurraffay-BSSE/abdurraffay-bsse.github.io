<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  /* =====================================================
     SUPABASE CONNECTION
  ===================================================== */

  const SUPABASE_URL =
    "https://cbefzissqyieupusgcuy.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_Z2QUBWHcWiFakL_5AvFZfg_7RvqMMvu";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /* =====================================================
     PHOTO CAROUSEL
  ===================================================== */

  const track =
    document.getElementById("carouselTrack");

  const dots =
    document.querySelectorAll(".dot");

  track.addEventListener("scroll", () => {

    const slideWidth =
      track.clientWidth;

    const index =
      Math.round(
        track.scrollLeft / slideWidth
      );

    dots.forEach((dot, i) => {

      dot.classList.toggle(
        "active",
        i === index
      );

    });

  });


  dots.forEach(dot => {

    dot.addEventListener("click", () => {

      const index =
        Number(dot.dataset.slide);

      track.scrollTo({
        left: index * track.clientWidth,
        behavior: "smooth"
      });

    });

  });


  /* =====================================================
     PAYMENT
  ===================================================== */

  const paymentInputs =
    document.querySelectorAll(
      'input[name="payment"]'
    );

  const bankInfo =
    document.getElementById("bankInfo");

  paymentInputs.forEach(input => {

    input.addEventListener("change", () => {

      if (input.value === "Bank Transfer") {

        bankInfo.classList.add("active");

      } else {

        bankInfo.classList.remove("active");

      }

    });

  });


  /* =====================================================
     TOTAL
  ===================================================== */

  const quantity =
    document.getElementById("quantity");

  const totalPrice =
    document.getElementById("totalPrice");

  const bottlePrice = 600;
  const delivery = 100;

  function updateTotal() {

    const bottles =
      Number(quantity.value);

    const total =
      (bottlePrice * bottles) + delivery;

    totalPrice.textContent =
      "Rs. " + total.toLocaleString();

  }

  quantity.addEventListener(
    "change",
    updateTotal
  );


  /* =====================================================
     MESSAGE HELPER
  ===================================================== */

  function showMessage(
    element,
    message,
    type
  ) {

    element.textContent = message;

    element.className =
      "form-message show " + type;

  }


  /* =====================================================
     LOAD APPROVED REVIEWS
  ===================================================== */

  async function loadReviews() {

    const reviewGrid =
      document.getElementById("reviewGrid");

    const {
      data,
      error
    } = await supabaseClient
      .from("reviews")
      .select(
        "name, rating, review, created_at"
      )
      .eq("approved", true)
      .order(
        "created_at",
        {
          ascending: false
        }
      );

    if (error) {

      console.error(
        "Could not load reviews:",
        error
      );

      return;
    }

    if (!data || data.length === 0) {
      return;
    }

    data.forEach(item => {

      const card =
        document.createElement("div");

      card.className =
        "review-card";

      const stars =
        "★".repeat(item.rating) +
        "☆".repeat(5 - item.rating);

      card.innerHTML = `
        <div class="stars">
          ${stars}
        </div>

        <p>
          "${escapeHTML(item.review)}"
        </p>

        <div class="review-author">
          ${escapeHTML(item.name)}
        </div>
      `;

      reviewGrid.prepend(card);

    });

  }


  /* =====================================================
     BASIC HTML ESCAPING
  ===================================================== */

  function escapeHTML(value) {

    const div =
      document.createElement("div");

    div.textContent =
      value;

    return div.innerHTML;

  }


  /* =====================================================
     REVIEW FORM
  ===================================================== */

  const reviewForm =
    document.getElementById("reviewForm");

  const reviewSubmit =
    document.getElementById("reviewSubmit");

  const reviewMessage =
    document.getElementById("reviewMessage");

  reviewForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      reviewSubmit.disabled = true;

      reviewSubmit.textContent =
        "SUBMITTING...";

      reviewMessage.className =
        "form-message";

      const name =
        document
          .getElementById("reviewName")
          .value
          .trim();

      const rating =
        Number(
          document
            .getElementById("reviewRating")
            .value
        );

      const review =
        document
          .getElementById("reviewText")
          .value
          .trim();


      const {
        error
      } = await supabaseClient
        .from("reviews")
        .insert({
          name: name,
          rating: rating,
          review: review
        });


      if (error) {

        console.error(error);

        showMessage(
          reviewMessage,
          "Something went wrong. Please try again.",
          "error"
        );

      } else {

        showMessage(
          reviewMessage,
          "Thank you! Your review has been submitted and will appear after approval.",
          "success"
        );

        reviewForm.reset();

      }


      reviewSubmit.disabled = false;

      reviewSubmit.textContent =
        "WRITE REVIEW";

    }
  );


  /* =====================================================
     ORDER FORM
     ===================================================== */

  const orderForm =
    document.getElementById("orderForm");

  const orderSubmit =
    document.getElementById("orderSubmit");

  const orderMessage =
    document.getElementById("orderMessage");


  orderForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      orderSubmit.disabled = true;

      orderSubmit.textContent =
        "PLACING ORDER...";

      orderMessage.className =
        "form-message";


      const customerName =
        document
          .getElementById("customerName")
          .value
          .trim();

      const customerPhone =
        document
          .getElementById("customerPhone")
          .value
          .trim();

      const customerEmail =
        document
          .getElementById("customerEmail")
          .value
          .trim();

      const customerArea =
        document
          .getElementById("customerArea")
          .value
          .trim();

      const customerAddress =
        document
          .getElementById("customerAddress")
          .value
          .trim();

      const bottles =
        Number(quantity.value);

      const paymentMethod =
        document.querySelector(
          'input[name="payment"]:checked'
        ).value;

      const orderNotes =
        document
          .getElementById("orderNotes")
          .value
          .trim();

      const total =
        (bottlePrice * bottles) +
        delivery;


      /* =====================================================
         SAVE ORDER TO SUPABASE

         IMPORTANT:
         We do NOT use .select() here because customers
         should not be allowed to read orders back.
      ===================================================== */

      const {
        error
      } = await supabaseClient
        .from("orders")
        .insert({
          customer_name: customerName,
          phone: customerPhone,
          email: customerEmail,
          area: customerArea,
          address: customerAddress,
          quantity: bottles,
          payment_method: paymentMethod,
          notes: orderNotes,
          total: total
        });


      if (error) {

        console.error(
          "Order error:",
          error
        );

        showMessage(
          orderMessage,
          "We couldn't place your order. Please try again.",
          "error"
        );

      } else {

        showMessage(
          orderMessage,
          "Order received successfully! We'll contact you shortly.",
          "success"
        );

        orderForm.reset();

        quantity.value = "1";

        updateTotal();

        bankInfo.classList.remove("active");

      }


      orderSubmit.disabled = false;

      orderSubmit.textContent =
        "PLACE ORDER";

    }
  );


  /* =====================================================
     START
  ===================================================== */

  updateTotal();

  loadReviews();

</script>
