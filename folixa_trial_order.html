<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOLIXA — Order Trial</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f7f4ec;
    color:#1d2b22;
  }
  .wrap{max-width:850px;margin:auto;padding:24px 16px 50px}
  h1{text-align:center;margin:10px 0 6px;font-size:32px}
  .sub{text-align:center;margin:0 0 24px;color:#666}
  .images{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:28px;
  }
  .imgbox{
    min-height:220px;
    border-radius:16px;
    background:#e5e0d2;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#777;
    font-weight:600;
    overflow:hidden;
  }
  .imgbox img{width:100%;height:100%;object-fit:cover;display:block}
  .card{
    background:#fff;
    border-radius:18px;
    padding:22px;
    box-shadow:0 5px 25px rgba(0,0,0,.07);
  }
  label{display:block;font-weight:600;margin:14px 0 7px}
  input,select,textarea{
    width:100%;
    padding:13px 14px;
    border:1px solid #d6d6d0;
    border-radius:10px;
    font-size:16px;
    outline:none;
    background:#fff;
  }
  textarea{min-height:95px;resize:vertical}
  button{
    width:100%;
    margin-top:20px;
    padding:15px;
    border:0;
    border-radius:11px;
    background:#1d2b22;
    color:white;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
  }
  button:disabled{opacity:.6;cursor:not-allowed}
  .note{font-size:13px;color:#777;text-align:center;margin-top:12px}
  .success{
    display:none;
    margin-top:16px;
    padding:14px;
    border-radius:10px;
    background:#e9f5eb;
    color:#245b31;
    text-align:center;
    font-weight:600;
  }
  @media(max-width:650px){
    .images{grid-template-columns:1fr}
    .imgbox{min-height:180px}
  }
</style>
</head>

<body>
<div class="wrap">
  <h1>FOLIXA</h1>
  <p class="sub">Natural Hair Oil — Trial Order Form</p>

  <!-- IMAGE SECTION -->
  <div class="images">
    <div class="imgbox">Product Image 1<br>Replace with your FOLIXA photo</div>
    <div class="imgbox">Product Image 2<br>Replace with your FOLIXA photo</div>
    <div class="imgbox">Product Image 3<br>Replace with your FOLIXA photo</div>
  </div>

  <!-- ORDER FORM -->
  <div class="card">
    <!--
      IMPORTANT:
      This uses FormSubmit only for this TRIAL page.
      It does not change your existing FOLIXA website.
      First submission may require email activation.
    -->
    <form action="https://formsubmit.co/nayapayonly13@gmail.com" method="POST">

      <input type="hidden" name="_subject" value="New FOLIXA Trial Order">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">

      <label for="name">Full Name</label>
      <input id="name" name="Customer Name" type="text" required>

      <label for="phone">Phone Number</label>
      <input id="phone" name="Phone Number" type="tel" required>

      <label for="city">City</label>
      <input id="city" name="City" type="text" required>

      <label for="address">Complete Address</label>
      <textarea id="address" name="Complete Address" required></textarea>

      <label for="quantity">Quantity</label>
      <select id="quantity" name="Quantity" required>
        <option value="1 Bottle">1 Bottle</option>
        <option value="2 Bottles">2 Bottles</option>
        <option value="3 Bottles">3 Bottles</option>
        <option value="4 Bottles">4 Bottles</option>
        <option value="5 Bottles">5 Bottles</option>
      </select>

      <label for="payment">Payment Method</label>
      <select id="payment" name="Payment Method" required>
        <option value="Cash on Delivery">Cash on Delivery</option>
        <option value="Bank Transfer">Bank Transfer</option>
      </select>

      <button type="submit">Submit Order</button>
    </form>

    <p class="note">This is a separate trial page. Your existing website is not changed.</p>
  </div>
</div>
</body>
</html>
